# The web service: the built app, with /api/, /_allauth/ and /static/ forwarded to the API on the
# same origin, as Vite's proxy does in development (M0 part 8 spec, P8.2; M4.3 spec, M4A.3).
server {
  listen 80;

  # An invite's token is in its /join/ path, so a Referer never carries a URL to another site.
  add_header Referrer-Policy same-origin always;

  # Docker's DNS, and the upstream in a variable, so nginx looks `api` up on each request.
  # A literal upstream is resolved once at startup, and every request 502s after `api` is
  # recreated with a new address (Labs measured this).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # allauth: sign-in, sign-up, the session, and GitHub's callback (M4A.3).
  location /_allauth/ {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The API docs page's files, served by WhiteNoise inside the API.
  location /static/ {
    set $api http://api:8000;
    proxy_pass $api$request_uri;
    proxy_set_header Host $http_host;
  }

  # Every other path is the app; it picks the page from the path.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
