[project]
name = "code-weaver"
version = "0.0.0"
description = "Comeni Code's weaver: goal targets to a route over needs links. Pure: no web framework, HTTP client or model library."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = ["code-schema"]

[project.scripts]
code-weaver = "code_weaver.cli:run"

[tool.uv.sources]
code-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
