# The diagnostic registry: one entry per code Comeni Code can report (spec M4.1.1, M4D.2).
#
# docs/reference/diagnostics.md is GENERATED from this file — do not edit it by hand.
# Regenerate with: uv run code-schema diagnostics --write docs/reference/diagnostics.md
# Explain one code with: uv run code-schema explain CS0201
#
# A code is C (Code, so it cannot collide with Comeni Labs' M, N and W), a letter for the
# subsystem that reports it — S code-schema, W code-weaver, A the API — and four digits, grouped
# in bands of one hundred by concern (the `bands:` list below holds them as data, and a test checks
# every code sits in its concern's band). …0000 is never allocated.
#
# A code is never renumbered: a published code is something a runbook, an issue or an author can
# cite. A code that goes out of use stays here, with `retired: <date> — <why>`.
#
# Each entry: emitted_by (schema | weaver | api), concern (its band), says (the general sentence;
# the problem's own message stays specific), refuses (true: an error; false: a warning that never
# blocks), fix (what to do) and explanation (why the rule exists).

bands:
  - {first: CS0001, last: CS0099, concern: fields}
  - {first: CS0100, last: CS0199, concern: links}
  - {first: CS0200, last: CS0299, concern: resources}
  - {first: CS0300, last: CS0399, concern: questions}
  - {first: CS0400, last: CS0499, concern: body}
  - {first: CS0500, last: CS0599, concern: graph}
  - {first: CS0600, last: CS0699, concern: registries}
  - {first: CS0700, last: CS0799, concern: discovery}
  - {first: CS0800, last: CS0899, concern: exam}
  - {first: CW0001, last: CW0099, concern: routes}
  - {first: CW0100, last: CW0199, concern: find}
  - {first: CA0001, last: CA0099, concern: index}
  - {first: CA0100, last: CA0199, concern: accounts}
  - {first: CA0200, last: CA0299, concern: drafts}

codes:

  # ── CS0001–CS0099 · a node's files and fields ─────────────────────────────────────────────────
  # The field checks are shared: the same code appears on a node's fields, a resource's, a
  # question's and a registry entry's, and the field in the problem line says which.

  CS0001:
    emitted_by: schema
    concern: fields
    says: the file is not valid YAML
    refuses: true
    fix: |
      Correct the YAML at the line given; the message quotes what the parser expected.
    explanation: |
      node.yaml, regions.yaml and providers.yaml are read as YAML before anything else, so
      nothing in the file can be checked until it parses (M1P1.3).

  CS0002:
    emitted_by: schema
    concern: fields
    says: a YAML file is empty
    refuses: true
    fix: |
      Write the file's fields, or remove the folder if it is not meant to be a node.
    explanation: |
      An empty node.yaml has none of the required fields, so it is reported once as empty rather
      than once per missing field (M1P1.3).

  CS0003:
    emitted_by: schema
    concern: fields
    says: a YAML file is not a mapping of fields
    refuses: true
    fix: |
      Write the file as `field: value` lines at the top level, not a list or a single value.
    explanation: |
      Every file the format reads is a mapping of named fields; a list or a bare value at the top
      has no names to check (M1P1.3).

  CS0004:
    emitted_by: schema
    concern: fields
    says: a field this format does not have
    refuses: true
    fix: |
      Remove the field, or correct its name to the one suggested. `helps` and link groups are
      designed but not accepted until content needs them (W3.2).
    explanation: |
      The field set is closed: an unknown field is almost always a typo, and a typo left silent is
      a field the app never reads (M1P1.3). The closest known name is offered when there is one.

  CS0005:
    emitted_by: schema
    concern: fields
    says: a required field is missing
    refuses: true
    fix: |
      Add the field named in the problem to node.yaml.
    explanation: |
      Every node carries schema, title, claim, region, level and minutes (M1P1.3): the route, the
      page and the index all read them.

  CS0006:
    emitted_by: schema
    concern: fields
    says: the node's schema version is not this validator's
    refuses: true
    fix: |
      Write `schema: 1`, or validate with the version of code-schema the node was written for.
    explanation: |
      A node says which version of the format it follows, so a validator never guesses at a file
      written for a later one (M1P1.3).

  CS0007:
    emitted_by: schema
    concern: fields
    says: a value that must be text is not
    refuses: true
    fix: |
      Write the value as text; quote it if YAML reads it as a number, a date or true/false.
    explanation: |
      Nothing is coerced: "12" and 12 are different values, and a coerced value means the file and
      the object disagree, so the writer would rewrite the file (M1P1.3).

  CS0008:
    emitted_by: schema
    concern: fields
    says: a text value is empty
    refuses: true
    fix: |
      Write the value, or leave out the field if it is optional.
    explanation: |
      An empty title, claim, reason or hint reaches a learner as a blank; a field that is present
      must say something (M1P1.3).

  CS0009:
    emitted_by: schema
    concern: fields
    says: a one-line value has a line break
    refuses: true
    fix: |
      Join the value into one line.
    explanation: |
      Titles, claims, reasons, hints and options are drawn as one line on the page; a line break
      would be lost or break the layout (M1P1.3).

  CS0010:
    emitted_by: schema
    concern: fields
    says: a text value is over its length
    refuses: true
    fix: |
      Shorten the value to the length the message gives.
    explanation: |
      Each field has a length that fits where it is drawn — a title in a map label, a claim in a
      card (M1P1.3). The limit lives in the validator, not in the database's columns (M1P5).

  CS0011:
    emitted_by: schema
    concern: fields
    says: a sentence does not end as one
    refuses: true
    fix: |
      End the value with a full stop, a question mark or an exclamation mark.
    explanation: |
      A claim, a reason, an ask or a hint is read as a sentence; ending it as one is the check the
      validator can keep, where counting sentences is not (M1P1.3).

  CS0012:
    emitted_by: schema
    concern: fields
    says: a value is not one of the listed choices
    refuses: true
    fix: |
      Use one of the values the message lists.
    explanation: |
      Levels, kinds, displays and the like are closed vocabularies: the page and the weaver know
      exactly these values and no others (M1P1.3, M3P1.2).

  CS0013:
    emitted_by: schema
    concern: fields
    says: a value that must be a whole number is not
    refuses: true
    fix: |
      Write a whole number without quotes or decimals.
    explanation: |
      Minutes and similar counts are whole numbers; a route's total time is their sum (M1P1.3).

  CS0014:
    emitted_by: schema
    concern: fields
    says: a number is below its minimum
    refuses: true
    fix: |
      Write a number at least as large as the minimum the message gives.
    explanation: |
      A node takes at least a minute; zero or less would make a route's time wrong (M1P1.3).

  CS0015:
    emitted_by: schema
    concern: fields
    says: an id is not lower case, digits and single hyphens
    refuses: true
    fix: |
      Rename the id, or the node's folder, to lower case letters, digits and single hyphens.
    explanation: |
      Ids appear in URLs, links and file names, so they take one safe form everywhere (M1P1.2). A
      node's id is its folder's name.

  CS0016:
    emitted_by: schema
    concern: fields
    says: a value is not in the registry that lists them
    refuses: true
    fix: |
      Use a value the registry lists — the closest is suggested — or add it to the registry in a
      pull request of its own.
    explanation: |
      A node's region comes from regions.yaml, so regions are decided once and every node agrees
      on them (M1P1.3).

  CS0017:
    emitted_by: schema
    concern: fields
    says: a value is not a url
    refuses: true
    fix: |
      Write the full address, starting https://, with no spaces.
    explanation: |
      Resources point outward, so their address must be one a learner's browser can open
      (M3P1.2).

  CS0018:
    emitted_by: schema
    concern: fields
    says: a url is not https
    refuses: true
    fix: |
      Write the https:// address of the same page.
    explanation: |
      Plain http is refused rather than upgraded: nothing in the format coerces a value (M3P1.2).

  CS0019:
    emitted_by: schema
    concern: fields
    says: an optional list is written empty
    refuses: true
    fix: |
      Remove the field; an absent list means none.
    explanation: |
      An optional list is written only when it has entries, so each file has one way to say
      "none" and the writer never adds or removes an empty list (M1P2).

  CS0020:
    emitted_by: schema
    concern: fields
    says: a node folder holds another node
    refuses: true
    fix: |
      Move the inner node's folder out beside this one.
    explanation: |
      A node folder holds exactly one node; nesting would make one node's files part of another's
      (M1P1.2).

  CS0021:
    emitted_by: schema
    concern: fields
    says: a node folder lacks one of its files
    refuses: true
    fix: |
      Add the missing node.yaml or body.md; a node needs both.
    explanation: |
      A node is its fields and its body together (M1P1.2); either alone is half a node.

  CS0022:
    emitted_by: schema
    concern: fields
    says: a file is not UTF-8
    refuses: true
    fix: |
      Save the file as UTF-8.
    explanation: |
      Every file is read as UTF-8, exactly, so it can be written back byte for byte (M1P1).

  CS0023:
    emitted_by: schema
    concern: fields
    says: a number is above its maximum
    refuses: true
    fix: |
      Write a number no larger than the maximum the message gives. A node longer than ten hours is
      several nodes: split it.
    explanation: |
      A node is a page read in one sitting, so its minutes stop at 600; a larger number is a typo,
      and one past the index's integer column would make the rebuild fail (#175).

  # ── CS0100–CS0199 · links ─────────────────────────────────────────────────────────────────────

  CS0101:
    emitted_by: schema
    concern: links
    says: a link field is not a list of links
    refuses: true
    fix: |
      Write the field as a list, each entry with node: and reason: on separate lines.
    explanation: |
      needs, goes-deeper and related are lists of links, each naming a node and saying why
      (M1P2.2).

  CS0102:
    emitted_by: schema
    concern: links
    says: an entry is not a link
    refuses: true
    fix: |
      Write the entry as `- node: <id>` with `reason: <sentence>` on the next line.
    explanation: |
      Every link has a node and a reason, so a bare id is refused: the reason is what the learner
      reads (M1P2.2).

  CS0103:
    emitted_by: schema
    concern: links
    says: a link has a key it cannot have
    refuses: true
    fix: |
      Remove the key; a link has node and reason only. `any-of` groups are designed but not
      accepted until content needs them (W3.2).
    explanation: |
      A link's shape is closed, so a misspelled key is caught rather than ignored (M1P2.2).

  CS0104:
    emitted_by: schema
    concern: links
    says: a link names no node
    refuses: true
    fix: |
      Add node: with the id of the node linked to.
    explanation: |
      A link without a node points nowhere (M1P2.2).

  CS0106:
    emitted_by: schema
    concern: links
    says: a link has no reason
    refuses: true
    fix: |
      Add reason: with one sentence saying why this node needs, goes deeper into or stands beside
      the other.
    explanation: |
      Every link carries a reason: it is what the learner reads instead of a bare chip, and what a
      reviewer judges the link by (M1P2.2, operator 2026-09-18).

  CS0108:
    emitted_by: schema
    concern: links
    says: a node links to itself
    refuses: true
    fix: |
      Remove the link.
    explanation: |
      A node cannot need, go deeper into or stand beside itself; a self-link is a cycle of one
      (M1P2.5).

  CS0109:
    emitted_by: schema
    concern: links
    says: a node is linked twice under one kind
    refuses: true
    fix: |
      Remove one of the two entries, keeping the better reason.
    explanation: |
      Each neighbour appears once under a kind, with one reason (M1P2.5).

  CS0110:
    emitted_by: schema
    concern: links
    says: a node has more than four peers
    refuses: true
    fix: |
      Keep the four nodes a learner might most read instead of this one, or split the node.
    explanation: |
      related means the peer test — what a learner might read instead of this node — capped at
      four; a node wanting more is probably two nodes (W3.2, M1P2.5).

  CS0111:
    emitted_by: schema
    concern: links
    says: a node is linked under two kinds
    refuses: true
    fix: |
      Keep the link under the one kind that answers the reader's question, and remove the other.
    explanation: |
      A node is one kind of neighbour: needs X and related X would be before and instead of at
      once (M1P2.5).

  # ── CS0200–CS0299 · resources and providers ─────────────────────────────────────────────────

  CS0201:
    emitted_by: schema
    concern: resources
    says: a resource cites a provider providers.yaml does not list
    refuses: true
    fix: |
      Correct the provider's id — the closest is suggested — or add the provider to
      providers.yaml in a pull request of its own.
    explanation: |
      Every resource names its provider, and providers.yaml decides which licences a provider may
      carry and whether it may be embedded (M3P1.2, tutor spec T4.2).

  CS0202:
    emitted_by: schema
    concern: resources
    says: a resource carries a licence its provider does not list
    refuses: true
    fix: |
      Correct the licence to one the provider lists, or change the provider's entry in its own
      pull request if its terms allow it.
    explanation: |
      Licences are recorded per provider, from its terms, so a resource cannot claim one its
      provider does not grant (M3P1.2, invariant 13).

  CS0203:
    emitted_by: schema
    concern: resources
    says: a resource asks to embed from a provider that does not allow it
    refuses: true
    fix: |
      Write display: link on the resource, or, if the provider's terms now allow embedding,
      change its entry in providers.yaml in a pull request of its own.
    explanation: |
      Whether a provider may be embedded is decided once, in providers.yaml, from its terms (tutor
      spec T4.2), not per resource. Khan Academy is linked, never embedded (issue 76).

  CS0204:
    emitted_by: schema
    concern: resources
    says: a video names a player its provider does not use
    refuses: true
    fix: |
      Use a player the provider lists, or add the player to the provider's entry.
    explanation: |
      A provider lists the players its videos play through, so the page only frames players it
      knows the provider uses (M3P5.3).

  CS0205:
    emitted_by: schema
    concern: resources
    says: "`resources:` is not a list"
    refuses: true
    fix: |
      Write resources: as a list of entries.
    explanation: |
      A node's outside resources are a list, in the order the author wants them shown (M3P1.2).

  CS0206:
    emitted_by: schema
    concern: resources
    says: an entry is not a resource
    refuses: true
    fix: |
      Write the entry as a mapping with kind, provider, url, covers, licence, display and level.
    explanation: |
      A resource is a small record, not a bare link (M3P1.2).

  CS0207:
    emitted_by: schema
    concern: resources
    says: a resource has a key it cannot have
    refuses: true
    fix: |
      Remove the key or correct it to one the message lists.
    explanation: |
      A resource's shape is closed, so a typo is caught rather than ignored (M3P1.2).

  CS0208:
    emitted_by: schema
    concern: resources
    says: a resource lacks a required key
    refuses: true
    fix: |
      Add the key the message names.
    explanation: |
      A resource needs its kind, provider, url, what it covers, licence, display and level to be
      shown and checked (M3P1.2).

  CS0209:
    emitted_by: schema
    concern: resources
    says: a resource's provider is not an id
    refuses: true
    fix: |
      Write the provider as its id from providers.yaml.
    explanation: |
      Providers are named by id, as providers.yaml lists them (M3P1.2).

  CS0211:
    emitted_by: schema
    concern: resources
    says: a video's part is not a timestamp range
    refuses: true
    fix: |
      Write the part as start–end, such as 2:10–7:45.
    explanation: |
      A video's part is where the player starts and stops, so it has to parse (M3P1.2, M3P5.3).

  CS0212:
    emitted_by: schema
    concern: resources
    says: a video's part ends before it starts
    refuses: true
    fix: |
      Swap or correct the two timestamps.
    explanation: |
      A player cannot stop before it starts (M3P1.2).

  CS0213:
    emitted_by: schema
    concern: resources
    says: a video is not written player:id
    refuses: true
    fix: |
      Write video: as player:id, such as youtube:Jnk_4Maf5Fk.
    explanation: |
      A video resource names the video it plays, because a provider's page URL does not contain
      the video's id (M3P5.3).

  CS0214:
    emitted_by: schema
    concern: resources
    says: a player this page cannot play
    refuses: true
    fix: |
      Use a player the message lists.
    explanation: |
      The page frames only players it knows how to build a no-cookie URL for (M3P5.3).

  CS0215:
    emitted_by: schema
    concern: resources
    says: a video id is not in its player's form
    refuses: true
    fix: |
      Copy the id from the video's address; a YouTube id is eleven letters, digits, - or _.
    explanation: |
      Each player's ids have a known form, checked so the page never builds a broken player
      (M3P5.3).

  CS0216:
    emitted_by: schema
    concern: resources
    says: a resource that is not a video names a video
    refuses: true
    fix: |
      Remove video:, or set kind: video if the resource is one.
    explanation: |
      Only a video plays in the page (M3P5.3).

  CS0217:
    emitted_by: schema
    concern: resources
    says: an embedded video names no video
    refuses: true
    fix: |
      Add video: player:id, or write display: link.
    explanation: |
      To embed, the page needs the video's own id, which the provider's page URL does not carry
      (M3P5.3).

  CS0218:
    emitted_by: schema
    concern: resources
    says: a node cites one url twice
    refuses: true
    fix: |
      Keep one entry for the url.
    explanation: |
      Each resource appears once in a node's Learn it (M3P1.2).

  # ── CS0300–CS0399 · questions ───────────────────────────────────────────────────────────────

  CS0301:
    emitted_by: schema
    concern: questions
    says: "`try:` is not a list"
    refuses: true
    fix: |
      Write try: as a list of questions.
    explanation: |
      A node's try questions are a list, each placed in the body by its id (M3P1.3).

  CS0302:
    emitted_by: schema
    concern: questions
    says: an entry is not a question
    refuses: true
    fix: |
      Write the entry as a mapping with id, kind, ask, hints and rationale.
    explanation: |
      A question is a small record (M3P1.3).

  CS0303:
    emitted_by: schema
    concern: questions
    says: a question has a key it cannot have
    refuses: true
    fix: |
      Remove the key or correct it to one the message lists.
    explanation: |
      A question's shape is closed, so a typo is caught rather than ignored (M3P1.3).

  CS0304:
    emitted_by: schema
    concern: questions
    says: a question has no id
    refuses: true
    fix: |
      Add id: — the name the body places it by.
    explanation: |
      The body places a question by its id (M3P1.3).

  CS0305:
    emitted_by: schema
    concern: questions
    says: a question has no kind
    refuses: true
    fix: |
      Add kind: choice or kind: number.
    explanation: |
      The kind decides how the answer is checked (M3P1.3).

  CS0306:
    emitted_by: schema
    concern: questions
    says: a kind of question that is designed, not built
    refuses: true
    fix: |
      Use kind: choice or kind: number until the phase the message names.
    explanation: |
      Figure questions are designed (tutor spec T7.1) and arrive with figures in M6; until then
      they are refused by name rather than silently ignored.

  CS0307:
    emitted_by: schema
    concern: questions
    says: a question asks nothing
    refuses: true
    fix: |
      Add ask: with the question, as one sentence.
    explanation: |
      The ask is what the learner reads (M3P1.3).

  CS0308:
    emitted_by: schema
    concern: questions
    says: a choice question has an answer
    refuses: true
    fix: |
      Remove answer: and mark the right option with right: true.
    explanation: |
      A choice question's answer is its right option, so a separate answer would be a second
      source of truth (M3P1.3).

  CS0309:
    emitted_by: schema
    concern: questions
    says: a choice question has no options
    refuses: true
    fix: |
      Add options:, two to five, one marked right: true.
    explanation: |
      A choice offers options (M3P1.3).

  CS0310:
    emitted_by: schema
    concern: questions
    says: a number question has options
    refuses: true
    fix: |
      Remove options:, or make the question a choice.
    explanation: |
      A number question is answered by typing a number (M3P1.3).

  CS0311:
    emitted_by: schema
    concern: questions
    says: a number question has no answer
    refuses: true
    fix: |
      Add answer: with the number.
    explanation: |
      The answer is what the typed number is checked against (M3P1.3).

  CS0312:
    emitted_by: schema
    concern: questions
    says: a number question's answer is not a number
    refuses: true
    fix: |
      Write the answer as a number, without quotes or units.
    explanation: |
      The answer is compared as a number; units go in unit: (M3P1.3).

  CS0313:
    emitted_by: schema
    concern: questions
    says: a choice question has a unit
    refuses: true
    fix: |
      Remove unit:.
    explanation: |
      Only a number question's answer has a unit (M3P1.3).

  CS0314:
    emitted_by: schema
    concern: questions
    says: a choice question has a tolerance
    refuses: true
    fix: |
      Remove tolerance:.
    explanation: |
      Only a number question is checked within a tolerance (M3P1.3).

  CS0315:
    emitted_by: schema
    concern: questions
    says: a tolerance is not a number of 0 or more
    refuses: true
    fix: |
      Write the tolerance as 0 or a positive number.
    explanation: |
      A tolerance is how far a typed answer may be from the right one (M3P1.3).

  CS0316:
    emitted_by: schema
    concern: questions
    says: a question has no hints
    refuses: true
    fix: |
      Add hints:, at least one, given one at a time.
    explanation: |
      A try question gives ordered hints while the learner answers (tutor spec T6.2).

  CS0317:
    emitted_by: schema
    concern: questions
    says: hints are not a list
    refuses: true
    fix: |
      Write hints: as a list, one hint per entry.
    explanation: |
      Hints are shown one at a time, in order (tutor spec T6.2).

  CS0318:
    emitted_by: schema
    concern: questions
    says: a question has too many hints
    refuses: true
    fix: |
      Keep the hints the message allows, most useful first.
    explanation: |
      A question with many hints stops being a question (tutor spec T6.2, M3P1.3).

  CS0319:
    emitted_by: schema
    concern: questions
    says: a hint gives the answer away
    refuses: true
    fix: |
      Rewrite the hint so it leads toward the answer without stating it.
    explanation: |
      A hint may not contain the answer — the right option's text, or the number standing alone
      (tutor spec T6.2, M3P1.3).

  CS0320:
    emitted_by: schema
    concern: questions
    says: a question has no rationale
    refuses: true
    fix: |
      Add rationale: saying why the answer is right.
    explanation: |
      The rationale is shown after the learner answers, right or wrong (tutor spec T6.2).

  CS0321:
    emitted_by: schema
    concern: questions
    says: a question id is used twice
    refuses: true
    fix: |
      Give each question in the node its own id.
    explanation: |
      The body places questions by id, so an id names one question (M3P1.3).

  CS0322:
    emitted_by: schema
    concern: questions
    says: options are not a list
    refuses: true
    fix: |
      Write options: as a list, each with text: and, on the right one, right: true.
    explanation: |
      A choice's options are shown in the author's order (M3P1.3).

  CS0323:
    emitted_by: schema
    concern: questions
    says: an entry is not an option
    refuses: true
    fix: |
      Write the option as text: and, on the right one, right: true.
    explanation: |
      An option is a small record, so the right one can be marked (M3P1.3).

  CS0324:
    emitted_by: schema
    concern: questions
    says: an option has a key it cannot have
    refuses: true
    fix: |
      Remove the key; an option has text and right.
    explanation: |
      An option's shape is closed, so a typo is caught rather than ignored (M3P1.3).

  CS0325:
    emitted_by: schema
    concern: questions
    says: an option has no text
    refuses: true
    fix: |
      Add text: to the option.
    explanation: |
      The text is what the learner chooses (M3P1.3).

  CS0326:
    emitted_by: schema
    concern: questions
    says: "`right` is not true or false"
    refuses: true
    fix: |
      Write right: true on the right option, and leave it out on the others.
    explanation: |
      Nothing is coerced: "yes" is not true (M3P1.3).

  CS0327:
    emitted_by: schema
    concern: questions
    says: a choice has too few or too many options
    refuses: true
    fix: |
      Offer two to five options.
    explanation: |
      One option is not a choice, and more than five is a list to read rather than a question
      (M3P1.3).

  CS0328:
    emitted_by: schema
    concern: questions
    says: a choice has no right option
    refuses: true
    fix: |
      Mark the right option with right: true.
    explanation: |
      A choice is checked against its right option (M3P1.3).

  CS0329:
    emitted_by: schema
    concern: questions
    says: a choice has more than one right option
    refuses: true
    fix: |
      Mark exactly one option right.
    explanation: |
      A choice has one right answer; several would need a different kind of question (M3P1.3).

  # ── CS0400–CS0499 · the body ────────────────────────────────────────────────────────────────

  CS0401:
    emitted_by: schema
    concern: body
    says: body.md is empty
    refuses: true
    fix: |
      Write the node's body.
    explanation: |
      Every node explains its claim in its body (M1P1.2).

  CS0402:
    emitted_by: schema
    concern: body
    says: a marker line the body does not read
    refuses: true
    retired: "2026-09-29 — the body moved to MyST fences (M4.1.2); a Markdoc-style line is now CS0414"
    fix: |
      Remove the line, or use a marker the body reads.
    explanation: |
      Markers that are not yet built are refused by name rather than drawn as braces (M3P1.3).

  CS0403:
    emitted_by: schema
    concern: body
    says: a question is placed that node.yaml does not have
    refuses: true
    fix: |
      Correct the id in the body, or add the question to try: in node.yaml.
    explanation: |
      The body places questions that node.yaml declares; a placement with no question would draw
      nothing (M3P1.3).

  CS0404:
    emitted_by: schema
    concern: body
    says: a question is placed twice
    refuses: true
    fix: |
      Keep one placement of the question.
    explanation: |
      Each question is asked in exactly one place (M3P1.3).

  CS0405:
    emitted_by: schema
    concern: body
    says: a question is never placed
    refuses: true
    fix: |
      Place the question in body.md where it should be asked, or remove it from node.yaml.
    explanation: |
      A question in node.yaml that the body never places would never be asked (M3P1.3).

  CS0406:
    emitted_by: schema
    concern: body
    says: a directive inside a directive
    refuses: true
    fix: |
      Close the outer directive before opening the next; directives sit at the top level of body.md.
    explanation: |
      Nesting is not read in M4: the first kind of block that needs it brings it (spec M4B.3).

  CS0407:
    emitted_by: schema
    concern: body
    says: a directive with options
    refuses: true
    fix: |
      Remove the `:key: value` line; no directive takes options yet.
    explanation: |
      Options are part of MyST, but none of the wired blocks has one, so a line that looks like an option is refused rather than read as prose (spec M4B.3).

  CS0408:
    emitted_by: schema
    concern: body
    says: a directive is never closed
    refuses: true
    fix: |
      Close the directive with `:::` on a line of its own.
    explanation: |
      An unclosed fence would silently swallow the rest of the body into one block (spec M4B.3).

  CS0409:
    emitted_by: schema
    concern: body
    says: a question placement with a body
    refuses: true
    fix: |
      Write `:::{try} <id>` and `:::` on the next line, with nothing between; the question lives in node.yaml.
    explanation: |
      A `try` block only places a question; its text, hints and rationale are fields of node.yaml (spec M4B.2).

  CS0410:
    emitted_by: schema
    concern: body
    says: a question placement names no question
    refuses: true
    fix: |
      Write the question's id after `:::{try}`.
    explanation: |
      A placement says which question is asked here (spec M4B.2).

  CS0411:
    emitted_by: schema
    concern: body
    says: a callout with no body
    refuses: true
    fix: |
      Write the callout's text between its opening line and `:::`, or remove it.
    explanation: |
      A callout with nothing in it draws an empty box (spec M4B.3).

  CS0412:
    emitted_by: schema
    concern: body
    says: a directive this format does not have
    refuses: true
    fix: |
      Use `try`, `misconception`, `caveat` or `convention` — the closest is suggested.
    explanation: |
      The body reads only its own directives; anything else would be drawn as text or lost (spec M4B.3, invariant 6).

  CS0413:
    emitted_by: schema
    concern: body
    says: a kind of block that is designed, not built
    refuses: true
    fix: |
      Leave the block out until the phase the message names.
    explanation: |
      Figures, math, images, examples, problems and claims are designed (W5.1) and arrive with the phase that builds them; until then they are refused by name rather than silently ignored (spec M4B.1).

  CS0414:
    emitted_by: schema
    concern: body
    says: a Markdoc-style tag line
    refuses: true
    fix: |
      Write the directive as a MyST colon fence: `:::{try} <id>` then `:::` on the next line.
    explanation: |
      The body moved from Markdoc-style `{% %}` markers to MyST fences in M4.1.2, as R1 chose; an old line is refused with a pointer rather than drawn as braces (spec M4B.2).

  CS0415:
    emitted_by: schema
    concern: body
    says: a body its blocks would not write back unchanged
    refuses: true
    fix: |
      Write directive lines exactly as `:::{name} argument` and `:::`, with no extra spaces, nothing between a try's two lines, one line ending throughout, and a line ending after the last `:::`.
    explanation: |
      Studio writes a body back from its blocks, so a body is accepted only if that gives the same bytes (spec M4B.4). Anything the blocks cannot carry, such as trailing spaces on a directive line, is refused here rather than silently rewritten later.

  # ── CS0500–CS0599 · the graph ───────────────────────────────────────────────────────────────

  CS0501:
    emitted_by: schema
    concern: graph
    says: a link names a node the content does not have
    refuses: true
    fix: |
      Correct the id — the closest is suggested — or add the node.
    explanation: |
      Links are checked across the whole content folder, so no route or page points at a node
      that is not there (M1P3.4).

  CS0502:
    emitted_by: schema
    concern: graph
    says: a peer link is written on one side only
    refuses: true
    fix: |
      Add the related link, with its reason, to the other node's node.yaml.
    explanation: |
      related is written on both nodes, so any node.yaml shows all its neighbours (M1P2.4).

  CS0503:
    emitted_by: schema
    concern: graph
    says: a goes-deeper link points to a lower level
    refuses: true
    fix: |
      Link to a node at the same level or higher, or change the link's kind.
    explanation: |
      Going deeper never goes down in level (M1P3.4, tutor spec T10.1).

  CS0504:
    emitted_by: schema
    concern: graph
    says: needs or goes-deeper links form a cycle
    refuses: true
    fix: |
      Remove the link that closes the ring; a node cannot come before itself.
    explanation: |
      A route is ordered by needs, so a cycle would have no order (invariant 2, M1P3.4). One
      message is given per tangle, with one whole ring.

  # ── CS0600–CS0699 · registries ──────────────────────────────────────────────────────────────

  CS0601:
    emitted_by: schema
    concern: registries
    says: regions.yaml is missing
    refuses: true
    fix: |
      Add regions.yaml at the content root.
    explanation: |
      Every node names a region, and regions.yaml lists them (M1P1.3).

  CS0602:
    emitted_by: schema
    concern: registries
    says: "`regions:` is not a list"
    refuses: true
    fix: |
      Write regions: as a list of entries, each with id and name.
    explanation: |
      The regions' order is the route's tie-break, so they are a list (M2P1.4).

  CS0603:
    emitted_by: schema
    concern: registries
    says: an entry is not a region
    refuses: true
    fix: |
      Write the entry with id: and name:.
    explanation: |
      A region is a small record (M1P1.3).

  CS0604:
    emitted_by: schema
    concern: registries
    says: a region id is listed twice
    refuses: true
    fix: |
      Keep one entry for the id.
    explanation: |
      A region has one place in the order (M2P1.4).

  CS0605:
    emitted_by: schema
    concern: registries
    says: a registry entry lacks a field
    refuses: true
    fix: |
      Add the field the message names.
    explanation: |
      Registry entries are read by every node that cites them (M1P1.3, M3P1.2).

  CS0606:
    emitted_by: schema
    concern: registries
    says: "`providers:` is not a list"
    refuses: true
    fix: |
      Write providers: as a list of entries.
    explanation: |
      providers.yaml lists every provider a resource may cite (M3P1.2).

  CS0607:
    emitted_by: schema
    concern: registries
    says: an entry is not a provider
    refuses: true
    fix: |
      Write the entry with id, name, licences and embed.
    explanation: |
      A provider is a small record (M3P1.2).

  CS0608:
    emitted_by: schema
    concern: registries
    says: a provider id is listed twice
    refuses: true
    fix: |
      Keep one entry for the id.
    explanation: |
      Each provider's terms are recorded once (M3P1.2).

  CS0609:
    emitted_by: schema
    concern: registries
    says: a provider lists no licences
    refuses: true
    fix: |
      Write licences: as a list with at least one licence.
    explanation: |
      A resource carries one of its provider's licences, so a provider must list one (M3P1.2).

  CS0610:
    emitted_by: schema
    concern: registries
    says: "`players:` is not a list"
    refuses: true
    fix: |
      Write players: as a list, such as [youtube], or leave it out.
    explanation: |
      A provider lists the players its videos play through (M3P5.3).

  CS0611:
    emitted_by: schema
    concern: registries
    says: "`embed` is not true or false"
    refuses: true
    fix: |
      Write embed: true or embed: false.
    explanation: |
      Nothing is coerced: "yes" is not true (M3P1.2).

  CS0612:
    emitted_by: schema
    concern: registries
    says: a resource is cited and providers.yaml is missing
    refuses: true
    fix: |
      Add providers.yaml at the content root.
    explanation: |
      providers.yaml is needed once a resource cites a provider, and not before (M3P1.2).

  # ── CS0700–CS0799 · finding nodes ───────────────────────────────────────────────────────────

  CS0701:
    emitted_by: schema
    concern: discovery
    says: the content root is not a folder
    refuses: true
    fix: |
      Pass the folder that holds the node folders and regions.yaml.
    explanation: |
      Validation reads a whole content folder (M1P3.2).

  CS0702:
    emitted_by: schema
    concern: discovery
    says: a folder has a body and no node.yaml
    refuses: true
    fix: |
      Add node.yaml beside body.md, or remove body.md.
    explanation: |
      A folder with a body is probably a node missing its fields, so it is reported rather than
      skipped (M1P3.2).

  CS0703:
    emitted_by: schema
    concern: discovery
    says: a near miss of node.yaml
    refuses: true
    fix: |
      Rename the file to node.yaml.
    explanation: |
      node.yml or Node.yaml would otherwise be skipped silently (M1P3.2).

  CS0704:
    emitted_by: schema
    concern: discovery
    says: the content root holds a node's files
    refuses: true
    fix: |
      Move the node's files into a folder of their own inside the root.
    explanation: |
      Node folders go inside the content root; the root is not a node (M1P3.2).

  CS0705:
    emitted_by: schema
    concern: discovery
    says: two folders have the same name
    refuses: true
    fix: |
      Rename one folder; a node's id is its folder's name.
    explanation: |
      Ids are unique across the content, wherever the folders sit (M1P3.2).

  CS0706:
    emitted_by: schema
    concern: discovery
    says: a near miss of exam.yaml
    refuses: true
    fix: |
      Rename the file to exam.yaml.
    explanation: |
      exam.yml or exams.yaml would otherwise be skipped silently, and a node would lose its pool
      without a word (M4E.3).

  # ── CS0800–CS0899 · exam pools ──────────────────────────────────────────────────────────────

  CS0801:
    emitted_by: schema
    concern: exam
    says: exam.yaml holds a key other than exam
    refuses: true
    fix: |
      Remove the key; exam.yaml holds only the exam: list.
    explanation: |
      The file is one pool and nothing else, so a typo is a problem rather than ignored (M4E.1).

  CS0802:
    emitted_by: schema
    concern: exam
    says: "exam.yaml has no exam: list"
    refuses: true
    fix: |
      Put the questions under exam:, or delete the file.
    explanation: |
      A node's pool is the exam: list in exam.yaml (M4E.1).

  CS0803:
    emitted_by: schema
    concern: exam
    says: "exam: is not a list"
    refuses: true
    fix: |
      Write exam: as a list of questions, each starting with - id:.
    explanation: |
      A pool is a list of questions, asked in no fixed order (M4E.1).

  CS0804:
    emitted_by: schema
    concern: exam
    says: the pool is empty
    refuses: true
    fix: |
      Delete exam.yaml; a node without a pool needs no file.
    explanation: |
      An empty file says nothing a missing one does not, and a node without exam.yaml is valid
      (M4E.1).

  CS0805:
    emitted_by: schema
    concern: exam
    says: "an entry in exam: is not a question"
    refuses: true
    fix: |
      Write each question as a mapping starting with - id:.
    explanation: |
      Each entry of the pool is one question (M4E.1).

  CS0806:
    emitted_by: schema
    concern: exam
    says: an unknown key in an exam question
    refuses: true
    fix: |
      Use only id, kind, ask, level, options, answer, unit, tolerance and rationale.
    explanation: |
      The fields are closed, so a typo is reported rather than ignored (M4E.1).

  CS0807:
    emitted_by: schema
    concern: exam
    says: an exam question has hints
    refuses: true
    fix: |
      Remove the hints; put what they say in the rationale, which the learner sees with the results.
    explanation: |
      A self-test gives no hints and no feedback until the end (tutor spec T7.1). Hints belong to
      try questions, which teach as they ask.

  CS0808:
    emitted_by: schema
    concern: exam
    says: an unknown key in an exam option
    refuses: true
    fix: |
      Use only text, right and misconception.
    explanation: |
      The fields are closed, so a typo is reported rather than ignored (M4E.1).

  CS0809:
    emitted_by: schema
    concern: exam
    says: a misconception names no callout
    refuses: true
    fix: |
      Write the exact title of a misconception callout in body.md, or add that callout.
    explanation: |
      A wrong answer will step back to the misconception it reveals (tutor spec T6.1), so the
      name must lead somewhere the learner can read (M4E.1).

  CS0810:
    emitted_by: schema
    concern: exam
    says: the right option names a misconception
    refuses: true
    fix: |
      Move the misconception to the wrong option that reflects it.
    explanation: |
      A misconception explains a wrong answer; the right one has nothing to step back to (M4E.1).

  CS0811:
    emitted_by: schema
    concern: exam
    says: an exam question reuses a try question's id
    refuses: true
    fix: |
      Give the exam question an id no question in node.yaml uses.
    explanation: |
      Every answer is stored as evidence named by node and question id (tutor spec T7), so one id
      must name one question across both pools (M4E.3).

  CS0812:
    emitted_by: schema
    concern: exam
    says: a pool holds more than 40 questions
    refuses: true
    fix: |
      Split the node, or keep the best 40 questions.
    explanation: |
      40 is a bound, not a target: it catches a draft or a generator that ran away. How many
      questions an exam asks is the exam builder's business (M4E.3, M4E.7).

  CS0813:
    emitted_by: schema
    concern: exam
    says: a pool has fewer than 4 questions
    refuses: false
    fix: |
      Write more questions until the pool has at least 4; more is better.
    explanation: |
      A node with fewer than 4 questions is left out of self-tests, since a result needs evidence
      from at least 2 questions and retakes should not repeat (tutor spec T7.1, M4E.7). A warning:
      a pool may be written a question at a time.

  CS0814:
    emitted_by: schema
    concern: exam
    says: a question's level is two or more from the node's
    refuses: false
    fix: |
      Ask at or near the node's level, or move the question to the node it fits.
    explanation: |
      A node holds exam questions at or near its own level, and review flags one two or more levels
      away (tutor spec T10.1). A warning: review decides.

  # ── CW0001–CW0099 · routes ──────────────────────────────────────────────────────────────────

  CW0001:
    emitted_by: weaver
    concern: routes
    says: two topics have one id
    refuses: true
    fix: |
      Give each topic its own id; validated content never has two.
    explanation: |
      The weaver checks its graph when it is built, so a weave never fails for the graph's own
      reasons (M2P1.3).

  CW0002:
    emitted_by: weaver
    concern: routes
    says: a topic's region is not in the order
    refuses: true
    fix: |
      Add the region to the order the graph is built with.
    explanation: |
      Stops are ordered by region, so every region has a place in the order (M2P1.4).

  CW0003:
    emitted_by: weaver
    concern: routes
    says: a topic's level is not in the order
    refuses: true
    fix: |
      Add the level to the order the graph is built with.
    explanation: |
      A route reports its level span from the level order (M2P2.4).

  CW0004:
    emitted_by: weaver
    concern: routes
    says: a topic needs one the graph does not have
    refuses: true
    fix: |
      Add the needed topic, or remove the need.
    explanation: |
      A route walks needs back from its goals; a need to nothing has nowhere to go (M2P1.3).

  CW0005:
    emitted_by: weaver
    concern: routes
    says: the graph's needs form a cycle
    refuses: true
    fix: |
      Remove the need that closes the ring.
    explanation: |
      A route orders each stop after what it needs; a cycle has no order (invariant 2, M2P1.3).

  CW0006:
    emitted_by: weaver
    concern: routes
    says: a goal is not in the graph
    refuses: true
    fix: |
      Use a node id the content has; code-weaver find suggests them.
    explanation: |
      An unknown goal is a bad request, not a bad graph, so it is reported apart from the graph's
      own problems (M2P1.3).

  CW0007:
    emitted_by: weaver
    concern: routes
    says: the content has problems
    refuses: true
    fix: |
      Run code-schema validate on the folder and fix what it reports.
    explanation: |
      The weaver weaves only content that validates (M2 part 3).

  CW0008:
    emitted_by: weaver
    concern: routes
    says: the content root is not a folder
    refuses: true
    fix: |
      Pass the folder that holds the node folders and regions.yaml.
    explanation: |
      The route and find commands read a whole content folder (M2 part 3).

  # ── CW0100–CW0199 · find ────────────────────────────────────────────────────────────────────

  CW0101:
    emitted_by: weaver
    concern: find
    says: a search has no words
    refuses: true
    fix: |
      Give at least one word to search for.
    explanation: |
      Search ranks topics by the words typed; with none there is nothing to rank (M3P2.3).

  # ── CA0001–CA0099 · the index and the read API ──────────────────────────────────────────────

  CA0001:
    emitted_by: api
    concern: index
    says: nothing has been indexed
    refuses: true
    fix: |
      Run manage.py rebuild_index with a content folder, or wait for the worker to index one.
    explanation: |
      The API answers from the index, and says so plainly with 503 before any build was applied,
      rather than answering as if the content were empty (M1P6.4).

  CA0002:
    emitted_by: api
    concern: index
    says: a node is not in the index
    refuses: true
    fix: |
      Check the id; the node may have been removed or renamed since the link was made.
    explanation: |
      An id not in the index is a normal case — links outlive renames — so it is a 404 with a
      sentence, not an error (M1P6.4).

  CA0003:
    emitted_by: api
    concern: index
    says: a search has no words
    refuses: true
    fix: |
      Send q= with at least one word.
    explanation: |
      Search ranks topics by the words given (M3P2.4).

  CA0004:
    emitted_by: api
    concern: index
    says: no content root was given
    refuses: true
    fix: |
      Pass --root, or set CODE_CONTENT_ROOT.
    explanation: |
      rebuild_index has no default folder, so it never quietly indexes the wrong one (M1P6.2).

  CA0005:
    emitted_by: api
    concern: index
    says: the content root is not a folder
    refuses: true
    fix: |
      Pass the folder that holds the node folders and regions.yaml.
    explanation: |
      rebuild_index reads a whole content folder (M1P6.2).

  CA0006:
    emitted_by: api
    concern: index
    says: the content has problems, so nothing was applied
    refuses: true
    fix: |
      Fix the problems listed after this line — each has its own code — and rebuild.
    explanation: |
      A rebuild is all or nothing: content with any problem changes nothing, so a route is never
      silently shortened by a skipped node (M1P5.2).

  # ── CA0100–CA0199 · accounts and access ────────────────────────────────────────────────────

  CA0101:
    emitted_by: api
    concern: accounts
    says: a Studio route was asked by nobody signed in
    refuses: true
    fix: |
      Sign in, by email and password or GitHub; an account comes only from an invite.
    explanation: |
      Studio is for the team, and the team signs in (M4.3 spec, M4A.4). Learner routes need no
      account and never answer this.

  CA0102:
    emitted_by: api
    concern: accounts
    says: a Studio route needs a higher role
    refuses: true
    fix: |
      Ask an operator for the role the route names.
    explanation: |
      Roles rank author < reviewer < operator, and each Studio route names the lowest role that
      may use it (W7.1; M4.3 spec, M4A.1, M4A.4).

  CA0103:
    emitted_by: api
    concern: accounts
    says: no invite has this link, or no pending invite has this id
    refuses: true
    fix: |
      Check the link was copied whole, or ask an operator for a new invite.
    explanation: |
      An invite is found by its token's hash; a link that matches none is not an invite (M4A.2).

  CA0104:
    emitted_by: api
    concern: accounts
    says: the invite has expired
    refuses: true
    fix: |
      Ask an operator for a new invite.
    explanation: |
      An invite lasts seven days, so a link left in a mailbox does not open sign-up forever
      (M4A.2).

  CA0105:
    emitted_by: api
    concern: accounts
    says: the invite was withdrawn
    refuses: true
    fix: |
      Ask an operator for a new invite.
    explanation: |
      An operator revoked it, or a newer invite to the same address replaced it (M4A.2).

  CA0106:
    emitted_by: api
    concern: accounts
    says: the invite has been used
    refuses: true
    fix: |
      Sign in with the account it made; an invite opens one sign-up.
    explanation: |
      An invite is single-use, so a forwarded link cannot make a second account (M4A.2).

  CA0107:
    emitted_by: api
    concern: accounts
    says: the address already has an account
    refuses: true
    fix: |
      Change the member's role on the team instead of inviting them.
    explanation: |
      One person has one account and one role (M4A.1); an invite makes a new account.

  CA0108:
    emitted_by: api
    concern: accounts
    says: the change would leave Studio without an active operator
    refuses: true
    fix: |
      Make another member an operator first, then demote or deactivate this one.
    explanation: |
      Only an operator invites and changes roles, so without one Studio could never be managed
      again (M4.3 spec, M4A.1).

  CA0109:
    emitted_by: api
    concern: accounts
    says: no member has this id
    refuses: true
    fix: |
      Use a public id from the team list.
    explanation: |
      Members are named by their public id, never the database's key (M4A.1).

  CA0110:
    emitted_by: api
    concern: accounts
    says: accepting an invite needs the CSRF token
    refuses: true
    fix: |
      Accept the invite from Code's own page, which sends the token from its csrftoken cookie.
    explanation: |
      Accepting changes the session, so a third-party page must not be able to do it on a
      visitor's behalf (#163).

  # ── CA0200–CA0299 · drafts ──────────────────────────────────────────────────────────────────

  CA0201:
    emitted_by: api
    concern: drafts
    says: no draft, or no open draft, has this id
    refuses: true
    fix: |
      Use a draft id from the list of open drafts.
    explanation: |
      Drafts are named by their public id (M4.4 spec, M4W.1); a discarded draft cannot be changed.

  CA0202:
    emitted_by: api
    concern: drafts
    says: the node already has a draft, open or under review
    refuses: true
    fix: |
      Edit that draft; if it is submitted, withdraw it first, and if approved, an operator sends
      it back. Or have a contributor or an operator discard it.
    explanation: |
      One live draft per node — open, submitted or approved — held by the database, so versions
      of a node are worked on in one place (M4W.1; M4.5 spec, M4R.3).

  CA0203:
    emitted_by: api
    concern: drafts
    says: the save was based on a revision that is no longer the latest
    refuses: true
    fix: |
      Reload the draft, then make the change again on its latest revision.
    explanation: |
      Each save names the revision it was based on, so nobody's save silently overwrites another's
      (optimistic concurrency, M4W.0, M4W.1).

  CA0204:
    emitted_by: api
    concern: drafts
    says: the index has no node with this id
    refuses: true
    fix: |
      Open it as a new node, with its first fields.
    explanation: |
      A draft of an existing node starts from the index (M4W.2).

  CA0205:
    emitted_by: api
    concern: drafts
    says: the edit does not apply to this node
    refuses: true
    fix: |
      Read the draft again: the position or question the edit names is not there.
    explanation: |
      Some edits cannot be said by a file — a block position out of range, a try block without
      its question, an exam question that is not in the pool — and are refused before the files
      are written (M4.4 spec, M4W.3).

  CA0206:
    emitted_by: api
    concern: drafts
    says: only a contributor or an operator may discard a draft
    refuses: true
    fix: |
      Ask someone who saved the draft, or an operator.
    explanation: |
      Discarding ends shared work, so it is for those who did it, or an operator (M4W.1).

  CA0207:
    emitted_by: api
    concern: drafts
    says: a new node's id is already a node
    refuses: true
    fix: |
      Open a draft of that node instead, or choose another id.
    explanation: |
      A new node's id must be new; ids are unique across the content (M1P3.2).

  CA0208:
    emitted_by: api
    concern: drafts
    says: the save's files would not validate
    refuses: true
    fix: |
      Fix each listed problem; each is code-schema's own, with its file and line.
    explanation: |
      Every save is checked by code-schema as CI checks the content repository, and a save with an
      error stores nothing (M4W.3).

  CA0209:
    emitted_by: api
    concern: drafts
    says: no revision has this number
    refuses: true
    fix: |
      Use a number from the draft's history.
    explanation: |
      Revisions are numbered from 1 within their draft (M4W.1).

  CA0210:
    emitted_by: api
    concern: drafts
    says: the save's files would read back as something else than was sent
    refuses: true
    fix: |
      Keep a title on one line, and keep ::: lines out of a block's text.
    explanation: |
      A save is stored only if its files read back as exactly the node the edit made, so a draft
      never holds other than what its author sent (M4.4 spec, M4W.3; #174).

  CA0211:
    emitted_by: api
    concern: drafts
    says: the draft is not in the state this step needs
    refuses: true
    fix: |
      Read the draft's state: submit an open draft, approve or reject a submitted one, send back an
      approved one. An edit or a discard needs the draft open: withdraw it first.
    explanation: |
      A submitted draft is frozen, so what is reviewed is exactly one revision, and an approved one
      is what lands (M4.5 spec, M4R.3).

  CA0212:
    emitted_by: api
    concern: drafts
    says: the checklist does not pass
    refuses: true
    fix: |
      Make each failed item the answer lists pass, then submit or approve again.
    explanation: |
      M4's bar — it verifies clean, a level, a resource, four exam questions — is checked at
      submit and again at approve, since a rebuild between the two can change it (M4R.3).

  CA0213:
    emitted_by: api
    concern: drafts
    says: a contributor approves or rejects their own draft
    refuses: true
    fix: |
      Ask a reviewer who did not save the draft, or an operator, to decide it.
    explanation: |
      Nobody approves what they drafted (invariant 5); an operator alone may, with a reason, so a
      team of one can still land content (M4R.2).

  CA0214:
    emitted_by: api
    concern: drafts
    says: a reason is missing where one is required
    refuses: true
    fix: |
      Say why in a sentence.
    explanation: |
      A rejection, a send back and a self-approval are read later, by the author and in the
      landing pull request, so each carries its reason (M4R.3).

  CA0215:
    emitted_by: api
    concern: drafts
    says: questions are unanswered at approval
    refuses: true
    fix: |
      Answer each question the message names, then approve.
    explanation: |
      Answering the node's own questions before approving is S6's defence against rubber-stamping
      (first spec, §5.5; M4R.1).

  CA0216:
    emitted_by: api
    concern: drafts
    says: the named revision is not the one submitted
    refuses: true
    fix: |
      Reload the draft and review the revision now submitted.
    explanation: |
      Nobody approves or rejects a revision they did not see; the call names the one it acts on
      (M4R.3).

  CA0217:
    emitted_by: api
    concern: drafts
    says: the submitted revision asks no question with this id
    refuses: true
    fix: |
      Use a question id from the review.
    explanation: |
      A reviewer answers the questions of the revision under review, by id (M4R.4).

  CA0218:
    emitted_by: api
    concern: drafts
    says: an answer is of the wrong kind
    refuses: true
    fix: |
      Give an option's index for a choice, a finite number for a number question.
    explanation: |
      Answers are graded by the web app's rule, in code_schema.grading, which takes nothing else
      (M4R.4).
