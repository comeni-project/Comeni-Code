[project]
name = "code-api"
version = "0.0.0"
description = "Comeni Code's Django project: accounts, content, studio, learn, requests and AI, behind one JSON API."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic-settings>=2.15,<3",
    "django-ninja>=1.7,<1.8",
    "whitenoise>=6.12,<7",
    "celery[redis]>=5.6,<5.7",
    "gunicorn>=26.2,<27",
    "code-schema",
]

# The node format and read_content, from this workspace: the index reads content as CI does.
[tool.uv.sources]
code-schema = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
