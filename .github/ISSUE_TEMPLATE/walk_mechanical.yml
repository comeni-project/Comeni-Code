name: "Walk: mechanical"
description: Found while walking — the code does not do what was already agreed
labels: [walk, mechanical]
body:
  - type: markdown
    attributes:
      value: |
        Fixed test-first and closed citing the commit. If fixing it would change what the product
        asks, allows or promises, use **Walk: protocol** instead. See `docs/internals/walking.md`.
  - type: input
    id: where
    attributes:
      label: Where, at what width and theme
      placeholder: "/route?goal=salmon&stop=k-mers, 1440 px, light"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the page, the API or a command did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: And where that was agreed (a board, a spec, a test).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A screenshot beside the board, the API response, a console error, the code path (`file:line`).
