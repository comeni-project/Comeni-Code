name: Something is broken
description: A page, a command or a document that does not do what it says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Found while walking the app beside the canvas? The **Walk**
        templates ask for what the fix needs.

        **If this is a way learner data or model keys could leak, or content that executes,
        do not file it here** — use
        [private reporting](https://github.com/comeni-project/Comeni-Code/security/advisories/new)
        instead.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you found instead.
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where
      description: The file, link or command.
      placeholder: node .design/build_pages.mjs
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: Optional. The full error output.
      render: shell
