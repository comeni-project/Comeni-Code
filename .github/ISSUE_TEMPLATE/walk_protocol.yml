name: "Walk: protocol"
description: Found while walking — a rule is too strict, too loose, or unclear
labels: [walk, protocol]
body:
  - type: markdown
    attributes:
      value: |
        Brainstormed as options, the operator chooses, the decision is commented here and labelled
        `decided`, then implemented. Never worked around. See `docs/internals/walking.md`.
  - type: input
    id: where
    attributes:
      label: Where, at what width and theme
      placeholder: "/node/dna-and-genes?goal=salmon, 360 px, dark"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the page, the API or a command did.
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Which way the rule failed
      options:
        - too strict — it stopped something that should work
        - too loose — it let through something it should not
        - unclear — nobody decided this case
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: The rule it touches
      placeholder: "invariant 2 (only needs links build routes); W3.2; the L4 board"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: A screenshot beside the board, the API response, the code path (`file:line`).
