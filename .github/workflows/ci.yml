name: CI

# Every pull request runs the same command sets as a local check, one job per language: python
# (M0 part 1 spec, P1.3; part 2, P2.4; part 4, P4.4), web (part 5, P5.4), and stack, which starts
# Compose and checks the health page through web (part 8, P8.4).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: code
          POSTGRES_PASSWORD: code
          POSTGRES_DB: code
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U code -d code"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # Settings load in mypy and pytest too, so every step sees these. CI-only values.
    env:
      CODE_SECRET_KEY: ci-only-insecure-key-for-github-actions-0000000000000000
      CODE_DATABASE_URL: postgresql://code:code@localhost:5432/code
      CODE_DEBUG: "false"
      CODE_ALLOWED_HOSTS: localhost
      CODE_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # uv reads .python-version and fetches 3.14 itself.
      - name: Sync the workspace
        run: uv sync --locked --all-packages

      - name: Django checks
        run: |
          uv run python apps/api/manage.py check
          uv run python apps/api/manage.py makemigrations --check --dry-run
          uv run python apps/api/manage.py migrate

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v
        # Includes both purity guards and their self-tests, the link check, and the API's
        # environment and database tests.

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The lockfile is the contract; .npmrc refuses install scripts and any Node but 24.
      - name: Install
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Development values only; CI has no secrets to give the stack.
      - name: Settings
        run: cp .env.example .env

      - name: Build
        run: docker compose build

      - name: Start
        run: docker compose up -d --wait --wait-timeout 180

      - name: Check through the web service
        run: ops/stack-check.sh

      - name: Logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
