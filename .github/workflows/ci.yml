name: CI

# Every pull request runs the same command set as a local check (M0 part 1 spec, P1.3). Later
# M0 parts add their own jobs here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # uv reads .python-version and fetches 3.14 itself.
      - name: Sync the workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -v
        # Includes both purity guards and their self-tests, and the link check.
